# Keep Render free-tier API warm so Piper TTS stays loaded.
# Render spins down free web services after 15 minutes without inbound HTTP
# (https://render.com/docs/free).
#
# GitHub Actions `schedule` can run late under load; */5 is still the best
# we can do from Actions alone (no external monitor).
#
# Set repository secret KEEPALIVE_HEALTH_URL to the full health URL, e.g.:
#   https://your-api.onrender.com/health
#
# If this workflow fails with:
#   - Internal server error (correlation ID)
#   - "job was not acquired by Runner of type hosted…"
#   - stuck on "Waiting for a runner…"
# while `curl "$KEEPALIVE_HEALTH_URL"` still returns {"status":"ok"}, that is a
# GitHub hosted-runner / Actions outage — not your API. Re-run or wait; check
# https://www.githubstatus.com . See root README "Keep Render awake".
name: Keep-alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    name: Ping API /health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Warm backend
        env:
          KEEPALIVE_HEALTH_URL: ${{ secrets.KEEPALIVE_HEALTH_URL }}
        run: |
          if [ -z "$KEEPALIVE_HEALTH_URL" ]; then
            echo "Secret KEEPALIVE_HEALTH_URL is not set — skipping ping."
            exit 0
          fi
          echo "GET $KEEPALIVE_HEALTH_URL"
          curl -fsS --max-time 90 "$KEEPALIVE_HEALTH_URL"
          echo
          echo "Keep-alive OK"
